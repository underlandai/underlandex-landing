site:
  name: UnderlandEX
  site: 'https://underlandex.com'
  base: '/'
  trailingSlash: false

  googleSiteVerificationId: ''

# Default SEO metadata
metadata:
  title:
    default: 'UnderlandEX | Private-Market Mining Intelligence'
    template: '%s | UnderlandEX'
  description: "UnderlandEX is a private mining data and service engine for origination, due diligence, valuation and transaction execution."
  robots:
    index: true
    follow: true
  openGraph:
    site_name: UnderlandEX
    images:
      - url: '~/assets/images/underlandex/og.png'
        width: 1200
        height: 630
    type: website
  twitter:
    cardType: summary_large_image

i18n:
  language: en-AU
  textDirection: ltr

analytics:
  vendors:
    googleAnalytics:
      id: null

ui:
  theme: 'light:only'
